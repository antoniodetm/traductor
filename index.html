<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Traductor Bidireccional</title>
    <style>
        :root {
            --primary: #0a84ff;
            --bg: #f2f2f7;
            --card: #ffffff;
            --text: #000000;
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #000000;
                --card: #1c1c1e;
                --text: #ffffff;
            }
        }

        body {
            font-family: -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .header {
            padding-top: calc(10px + var(--safe-top));
            padding-bottom: 15px;
            background: var(--card);
            border-bottom: 0.5px solid #3c3c434d;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
            position: relative;
        }

        .version {
            position: absolute;
            top: calc(5px + var(--safe-top));
            right: 15px;
            font-size: 0.6rem;
            color: #8e8e93;
            font-weight: 600;
        }

        .title {
            font-size: 1rem;
            font-weight: 600;
            margin: 0;
        }

        .lang-selector {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        .lang-badge {
            padding: 8px 16px;
            background: var(--bg);
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
            border: 1px solid #3c3c434d;
        }

        .swap-btn {
            background: var(--primary);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 10px 15px 5px;
            gap: 8px;
            overflow: hidden;
        }

        .box {
            background: var(--card);
            padding: 12px;
            border-radius: 18px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .box-top {
            max-height: 25%;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .box-main {
            flex: 1;
            border-left: 5px solid var(--primary);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .label {
            font-size: 0.65rem;
            font-weight: 700;
            color: #8e8e93;
            text-transform: uppercase;
            margin-bottom: 5px;
            display: block;
        }

        p {
            font-size: 1.2rem;
            line-height: 1.4;
            margin: 0;
            white-space: pre-wrap;
        }

        .interim-text {
            color: #8e8e93;
            font-style: italic;
        }

        .log-container {
            margin: 0 15px 8px;
            padding: 8px;
            background: #1c1c1e;
            color: #32d74b;
            font-family: 'Courier New', monospace;
            font-size: 0.6rem;
            border-radius: 12px;
            height: 60px;
            overflow-y: auto;
            border: 1px solid #3c3c43;
        }

        .footer {
            padding: 10px 20px calc(10px + var(--safe-bottom));
            background: var(--card);
            border-top: 0.5px solid #3c3c434d;
        }

        .volume-meter {
            width: 100%;
            height: 4px;
            background: #e5e5ea;
            border-radius: 2px;
            margin-bottom: 10px;
            overflow: hidden;
        }

        #volumeBar {
            width: 0%;
            height: 100%;
            background: #34c759;
            transition: width 0.1s ease;
        }

        .main-btn {
            width: 100%;
            height: 54px;
            border-radius: 16px;
            border: none;
            background: var(--primary);
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .main-btn.listening {
            background: #ff453a;
        }
    </style>
</head>

<body>

    <div class="header">
        <div class="version">v2.2.0</div>
        <h1 class="title">Traductor</h1>
        <div class="lang-selector">
            <div class="lang-badge" id="langFromLabel">EN</div>
            <button class="swap-btn" id="swapBtn">⇄</button>
            <div class="lang-badge" id="langToLabel">ES</div>
        </div>
    </div>

    <div class="content">
        <div class="box box-top" id="boxTop">
            <span class="label" id="inputLabel">Orig:</span>
            <p id="originalText"></p>
        </div>
        <div class="box box-main" id="scrollContainer">
            <span class="label" id="outputLabel">Trad:</span>
            <p id="translatedText"></p>
        </div>
    </div>

    <div class="log-container" id="logBox">
        <div>> Sistema listo</div>
    </div>

    <div class="footer">
        <div class="volume-meter">
            <div id="volumeBar"></div>
        </div>
        <button class="main-btn" id="listenBtn">Iniciar Escucha</button>
    </div>

    <script>
        const listenBtn = document.getElementById('listenBtn');
        const swapBtn = document.getElementById('swapBtn');
        const originalText = document.getElementById('originalText');
        const translatedText = document.getElementById('translatedText');
        const langFromLabel = document.getElementById('langFromLabel');
        const langToLabel = document.getElementById('langToLabel');
        const inputLabel = document.getElementById('inputLabel');
        const outputLabel = document.getElementById('outputLabel');
        const scrollContainer = document.getElementById('scrollContainer');
        const boxTop = document.getElementById('boxTop');
        const logBox = document.getElementById('logBox');
        const volumeBar = document.getElementById('volumeBar');

        let isEnglishToSpanish = true;
        let isListening = false;
        let historyOriginal = "";
        let historyTranslated = "";
        let interimOriginal = "";
        let interimTranslated = "";
        let translationTimeout;
        let audioContext, analyser, dataArray, micStream;

        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        function addLog(msg) {
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            const entry = document.createElement('div');
            entry.innerText = `[${time}] ${msg}`;
            logBox.appendChild(entry);
            logBox.scrollTop = logBox.scrollHeight;
            if (logBox.children.length > 25) logBox.removeChild(logBox.firstChild);
        }

        async function initAudioMeter() {
            if (audioContext) return;
            try {
                micStream = await navigator.mediaDevices.getUserMedia({
                    audio: { autoGainControl: true, noiseSuppression: true, echoCancellation: true }
                });
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioContext.createMediaStreamSource(micStream);
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                source.connect(analyser);
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                updateVolume();
                addLog("Audio HW: OK");
            } catch (e) {
                addLog("Audio HW: Error");
            }
        }

        function updateVolume() {
            if (!isListening) {
                volumeBar.style.width = "0%";
            } else if (analyser) {
                analyser.getByteFrequencyData(dataArray);
                let sum = 0;
                for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
                let average = sum / dataArray.length;
                let vol = Math.min(100, average * 3.5);
                volumeBar.style.width = vol + "%";
                volumeBar.style.background = vol < 15 ? "#ff9500" : "#34c759";
            }
            requestAnimationFrame(updateVolume);
        }

        if (!SpeechRecognition) {
            addLog("Error: API voz no disponible");
            listenBtn.disabled = true;
        }

        const recognition = SpeechRecognition ? new SpeechRecognition() : null;
        if (recognition) {
            recognition.continuous = !isIOS;
            recognition.interimResults = true;
            recognition.maxAlternatives = 1;
        }

        function updateLabels() {
            const from = isEnglishToSpanish ? "EN" : "ES";
            const to = isEnglishToSpanish ? "ES" : "EN";
            if (recognition) recognition.lang = isEnglishToSpanish ? 'en-US' : 'es-ES';
            langFromLabel.innerText = from;
            langToLabel.innerText = to;
            inputLabel.innerText = `Orig (${from}):`;
            outputLabel.innerText = `Trad (${to}):`;
        }

        updateLabels();

        function render() {
            originalText.innerHTML = historyOriginal + `<span class="interim-text">${interimOriginal}</span>`;
            translatedText.innerHTML = historyTranslated + `<span class="interim-text">${interimTranslated}</span>`;
            scrollContainer.scrollTop = scrollContainer.scrollHeight;
            boxTop.scrollTop = boxTop.scrollHeight;
        }

        async function fetchTranslation(text) {
            if (!text.trim()) return "";
            const sl = isEnglishToSpanish ? "en" : "es";
            const tl = isEnglishToSpanish ? "es" : "en";

            // Método 1: Google Translate GTX
            try {
                const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&dt=t&q=${encodeURIComponent(text)}&ie=UTF-8&oe=UTF-8`;
                const res = await fetch(url);
                if (res.ok) {
                    const data = await res.json();
                    if (data && data[0]) return data[0].map(s => s[0]).join('');
                } else if (res.status === 429) {
                    addLog("Google: Límite excedido");
                }
            } catch (e) {
                addLog("Google: Fallo. Probando fallback...");
            }

            // Método 2: Fallback MyMemory
            try {
                const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${sl}|${tl}`;
                const res = await fetch(url);
                const data = await res.json();
                if (data && data.responseData) return data.responseData.translatedText;
            } catch (e) {
                addLog("API Error: Sin conexión");
                return "[Error]";
            }
            return "[Error]";
        }

        listenBtn.onclick = async () => {
            if (!recognition) return;
            if (!isListening) {
                initAudioMeter();
                historyOriginal = ""; historyTranslated = ""; interimOriginal = ""; interimTranslated = "";
                render();
                try {
                    recognition.start();
                    addLog("Mic: ON");
                } catch (e) { addLog("Mic: Error inicio"); }
            } else {
                isListening = false;
                try { recognition.stop(); } catch (e) { }
                addLog("Mic: OFF");
            }
        };

        if (recognition) {
            recognition.onstart = () => {
                isListening = true;
                listenBtn.innerText = "Detener";
                listenBtn.classList.add('listening');
                addLog("Escuchando...");
            };

            recognition.onend = () => {
                if (isListening) {
                    setTimeout(() => { if (isListening) try { recognition.start(); } catch (e) { } }, isIOS ? 150 : 300);
                } else {
                    listenBtn.innerText = "Iniciar Escucha";
                    listenBtn.classList.remove('listening');
                }
            };

            recognition.onerror = (e) => {
                addLog(`Err Voz: ${e.error}`);
                if (e.error === 'not-allowed') isListening = false;
            };

            recognition.onresult = async (event) => {
                let newInterim = "";
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    const res = event.results[i];
                    if (res.isFinal) {
                        const cleanText = res[0].transcript.trim();
                        if (cleanText) {
                            addLog(`Voz: ${cleanText.substring(0, 10)}...`);
                            historyOriginal += cleanText + ". ";
                            render();
                            const translated = await fetchTranslation(cleanText);
                            historyTranslated += translated + " ";
                            interimOriginal = ""; interimTranslated = "";
                            render();
                        }
                    } else {
                        newInterim += res[0].transcript;
                    }
                }
                if (newInterim && newInterim !== interimOriginal) {
                    interimOriginal = newInterim;
                    render();
                    clearTimeout(translationTimeout);
                    translationTimeout = setTimeout(async () => {
                        if (interimOriginal.length > 3 && isListening) {
                            interimTranslated = await fetchTranslation(interimOriginal);
                            render();
                        }
                    }, 1000);
                }
            };
        }

        swapBtn.onclick = () => {
            isEnglishToSpanish = !isEnglishToSpanish;
            updateLabels();
            historyOriginal = ""; historyTranslated = ""; interimOriginal = ""; interimTranslated = "";
            render();
            if (isListening && recognition) try { recognition.stop(); } catch (e) { }
        };
    </script>
</body>

</html>
